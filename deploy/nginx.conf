# A1 360 — nginx site.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/a1360
#   sudo ln -s /etc/nginx/sites-available/a1360 /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot fill in the TLS block:
#   sudo certbot --nginx -d a1360.example.com
#
# HTTPS is not optional here. The service worker that makes the field
# surfaces work with no signal will not register over plain HTTP, so on
# http:// a technician silently loses offline page loads — the one capability
# the pilot exists to prove.

upstream a1360 {
    server unix:/run/a1360/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name a1360.example.com;

    # certbot writes its challenge here before rewriting this file.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name a1360.example.com;

    # certbot --nginx replaces these three lines.
    ssl_certificate     /etc/letsencrypt/live/a1360.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a1360.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # A site assessment arrives as one JSON body carrying up to twelve
    # photographs as base64. nginx's 1 MB default would reject it with a 413
    # the technician cannot act on. Keep this in step with
    # DATA_UPLOAD_MAX_MEMORY_SIZE in settings.
    client_max_body_size 25M;

    # Decoding those photographs takes longer than a page render.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    access_log /var/log/nginx/a1360.access.log;
    error_log  /var/log/nginx/a1360.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Hashed filenames, so these can be cached hard and for a long time.
    location /static/ {
        alias /srv/a1360/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded photographs and receipts.
    #
    # Served straight from disk, which means anyone holding the URL can open
    # one without signing in. The filenames are UUIDs, so they are not
    # guessable, but they are not access-controlled either. If A-1 needs
    # these behind the login, set CLOUDINARY_* and use signed delivery, or
    # replace this block with an X-Accel-Redirect through a Django view.
    location /media/ {
        alias /srv/a1360/media/;
        access_log off;
        expires 30d;
    }

    # The service worker must not be cached, or a deploy cannot replace it
    # and phones keep serving the previous release's shell.
    location = /sw.js {
        proxy_pass http://a1360;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        proxy_pass http://a1360;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django reads this to know the request was already secure; without
        # it SECURE_SSL_REDIRECT loops forever.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
